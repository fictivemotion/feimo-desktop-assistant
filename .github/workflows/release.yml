name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64 packages
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify 伊埃斯 fan-art pack and non-commercial license
        shell: pwsh
        run: |
          $required = @(
            'assets/pets/eous/spritesheet.webp',
            'assets/pets/eous/edge-peek.png',
            'assets/pets/eous/rest-side.png',
            'assets/pets/eous/LICENSE.txt'
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            throw 'Release stopped: 伊埃斯 fan art and its separate license must ship together.'
          }
          $license = Get-Content -Raw 'assets/pets/eous/LICENSE.txt'
          if ($license -notmatch 'CC BY-NC-SA 4\.0' -or $license -notmatch 'HoYoverse|miHoYo') {
            throw 'Release stopped: verify the non-commercial fan-art license and original IP notice.'
          }

      - name: Package installer and portable app
        run: npm run dist:win

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem release -Filter *.exe
          $rows = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $rows | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: feimo-windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: feimo-windows-x64
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --title "斐墨 ${GITHUB_REF_NAME}" --generate-notes
