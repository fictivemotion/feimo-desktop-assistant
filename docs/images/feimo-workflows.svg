<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">斐墨快捷任务与只读同步流程</title>
  <desc id="desc">展示剪贴板清洗、截图本地 OCR、Agent 与 Token 本地读取以及 Notion 只读同步的数据流。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff7f7"/><stop offset=".55" stop-color="#eef0f8"/><stop offset="1" stop-color="#faf0f2"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".94"/><stop offset="1" stop-color="#fff" stop-opacity=".66"/></linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#64748b" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 0 9Z" fill="#82bdb6"/></marker>
  </defs>
  <rect width="1440" height="820" rx="40" fill="url(#bg)"/>
  <text x="78" y="91" fill="#20354b" font-family="HarmonyOS Sans SC, Microsoft YaHei, sans-serif" font-size="36" font-weight="700">两组快捷键，常用小事马上完成</text>
  <text x="80" y="130" fill="#6a7b90" font-family="HarmonyOS Sans SC, Microsoft YaHei, sans-serif" font-size="18">无需切换窗口 · 进度由斐墨气泡提示 · 结果直接回到剪贴板</text>
  <g filter="url(#shadow)" font-family="HarmonyOS Sans SC, Microsoft YaHei, sans-serif">
    <rect x="72" y="180" width="620" height="260" rx="28" fill="url(#card)" stroke="#fff" stroke-width="2"/>
    <rect x="748" y="180" width="620" height="260" rx="28" fill="url(#card)" stroke="#fff" stroke-width="2"/>
    <rect x="72" y="484" width="620" height="260" rx="28" fill="url(#card)" stroke="#fff" stroke-width="2"/>
    <rect x="748" y="484" width="620" height="260" rx="28" fill="url(#card)" stroke="#fff" stroke-width="2"/>
  </g>
  <g font-family="HarmonyOS Sans SC, Microsoft YaHei, sans-serif">
    <!-- Text cleanup -->
    <rect x="104" y="211" width="150" height="34" rx="17" fill="#e4f3ef"/><text x="122" y="234" fill="#4c8d85" font-size="14" font-weight="650">Alt + Shift + O</text>
    <text x="104" y="285" fill="#29445b" font-size="23" font-weight="700">剪贴板文本清洗</text>
    <text x="104" y="326" fill="#64788d" font-size="16">移除段落空行、清除 OCR 字间空格、修整无效字符</text>
    <rect x="104" y="356" width="170" height="48" rx="13" fill="#f0f3f6"/><text x="127" y="386" fill="#607489" font-size="14">选中的文本</text>
    <path d="M290 380 H370" stroke="#82bdb6" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="390" y="356" width="226" height="48" rx="13" fill="#e4f3ef"/><text x="412" y="386" fill="#4b837e" font-size="14">清洗完成 · 已复制</text>
    <!-- Image OCR -->
    <rect x="780" y="211" width="150" height="34" rx="17" fill="#f8eee8"/><text x="798" y="234" fill="#aa7357" font-size="14" font-weight="650">Alt + Shift + T</text>
    <text x="780" y="285" fill="#29445b" font-size="23" font-weight="700">截图本地 OCR</text>
    <text x="780" y="326" fill="#64788d" font-size="16">Windows OCR 识别图片，再合并段落与清洗空格</text>
    <rect x="780" y="356" width="150" height="48" rx="13" fill="#f4f1ec"/><text x="811" y="386" fill="#8b775d" font-size="14">剪贴板图片</text>
    <path d="M944 380 H1021" stroke="#d5a07f" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1040" y="356" width="272" height="48" rx="13" fill="#f8eee8"/><text x="1060" y="386" fill="#a9765b" font-size="14">识别完成 · 文字已复制</text>
    <!-- Local agents and tokens -->
    <text x="104" y="544" fill="#29445b" font-size="23" font-weight="700">Coding 会话与 Token 用量</text>
    <text x="104" y="584" fill="#64788d" font-size="16">本地读取 · 汇总去重 · 不发送到斐墨服务器</text>
    <rect x="104" y="619" width="142" height="58" rx="14" fill="#eef1f7"/><text x="130" y="654" fill="#5b6c81" font-size="14">Codex</text>
    <rect x="260" y="619" width="142" height="58" rx="14" fill="#eef1f7"/><text x="286" y="654" fill="#5b6c81" font-size="14">ZCode</text>
    <rect x="416" y="619" width="142" height="58" rx="14" fill="#eef1f7"/><text x="442" y="654" fill="#5b6c81" font-size="14">WorkBuddy</text>
    <text x="104" y="711" fill="#718398" font-size="13">状态变化提醒 · 热力图 · CSV</text>
    <!-- Notion -->
    <text x="780" y="544" fill="#29445b" font-size="23" font-weight="700">Notion 日程只读同步</text>
    <text x="780" y="584" fill="#64788d" font-size="16">你自己连接数据库 · 本机保存凭据 · 定时主动提醒</text>
    <rect x="780" y="619" width="200" height="58" rx="14" fill="#f0f3f6"/><text x="808" y="654" fill="#607489" font-size="14">你的 Notion 数据库</text>
    <path d="M994 648 H1080" stroke="#82bdb6" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1100" y="619" width="210" height="58" rx="14" fill="#e4f3ef"/><text x="1132" y="654" fill="#4b837e" font-size="14">斐墨日程与提醒</text>
    <text x="780" y="711" fill="#718398" font-size="13">连接凭据与日历数据不包含在公开源码中</text>
  </g>
  <text x="78" y="786" fill="#718398" font-family="HarmonyOS Sans SC, Microsoft YaHei, sans-serif" font-size="14">斐墨 · Feimo · 本地优先的轻量 Windows 桌面助手</text>
</svg>
