<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>斐墨 · 顶部模式</title><link rel="stylesheet" href="../shared/feimo-design.css"/><link rel="stylesheet" href="../shared/island-widgets.css"/><link rel="stylesheet" href="island.css"/></head><body>
