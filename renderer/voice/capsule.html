<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:"><title>斐墨语音</title><link rel="stylesheet" href="../shared/feimo-design.css"><link rel="stylesheet" href="capsule.css"></head><body>
<div id="capsule" role="status" aria-live="polite">
  <span class="mic" data-icon="Microphone" data-size="16"></span><div id="wave" aria-hidden="true"></div>
  <div class="caption"><strong id="message">准备麦克风…</strong><span id="time">00:00</span></div>
  <button id="pause" aria-label="暂停听写" title="暂停 / 继续"><span data-icon="Pause" data-size="16"></span></button>
  <button id="finish" class="finish" aria-label="结束并校对" title="结束并校对"><span data-icon="Stop" data-size="16"></span></button>
  <button id="close" aria-label="取消听写" title="取消听写，保留已输入的文字"><span data-icon="Close" data-size="16"></span></button>
</div><script src="../shared/reicon-filled.js"></script><script src="capture.js"></script></body></html>
