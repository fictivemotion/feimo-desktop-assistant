<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'"><title>斐墨 · 区域截图</title><link rel="stylesheet" href="../shared/feimo-design.css"><link rel="stylesheet" href="screenshot.css"></head><body>
<img id="screen" alt="冻结的屏幕画面"><canvas id="mask"></canvas><canvas id="edit" hidden></canvas><div id="hint">拖动选择截图区域 · Esc 取消</div><div id="size" hidden></div>
<nav id="toolbar" hidden aria-label="截图工具栏"><div id="draw-tools"></div><input id="color" type="color" value="#e65c61" aria-label="标注颜色"><select id="weight" aria-label="线条粗细"><option value="3">细</option><option value="6">中</option><option value="10">粗</option></select><span class="divider"></span><button id="recognize" title="提取文字、表格或公式" aria-label="提取文字"><span data-icon="DocumentText"></span></button><button id="translate" title="图片翻译" aria-label="图片翻译"><span data-icon="ChatDots"></span></button><button id="palette" title="提取色值" aria-label="提取色值"><span data-icon="Palette"></span></button><button id="undo" title="撤销 Ctrl+Z" aria-label="撤销"><span data-icon="ArrowLeft"></span></button><button id="reselect" title="重新选区" aria-label="重新选区"><span data-icon="Image"></span></button><button id="save" title="保存到本地" aria-label="保存截图到本地"><span data-icon="Folder"></span></button><span class="divider"></span><button id="cancel" title="取消 Esc" aria-label="取消截图"><span data-icon="CloseCircle"></span></button><button id="done" class="confirm" title="复制截图并加入剪贴板历史 Enter" aria-label="完成截图"><span data-icon="CheckCircle"></span></button></nav>
<section id="menu" hidden></section><section id="result" hidden><header><strong id="result-title">提取结果</strong><button id="result-close" aria-label="关闭结果">×</button></header><textarea id="result-text" aria-label="可编辑的提取结果"></textarea><div id="swatches" hidden></div><footer><button id="result-copy">复制结果</button><span id="result-note"></span></footer></section><textarea id="annotation" hidden aria-label="标注文字" placeholder="输入标注，Enter 确认"></textarea><div id="status" role="status" hidden></div>
<script src="../shared/reicon-filled.js"></script><script src="screenshot.js"></script></body></html>
